name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run installed-package tests
        run: python -I -m unittest discover -s tests
      - name: Check installed CLI
        run: |
          fancy-daily --version
          fancy-daily parse --strict examples/daily-note.txt
          fancy-daily parse --strict --require-section highlights --format markdown examples/daily-note.md
          python -I -m fancy_daily parse --strict --format compact-json examples/daily-note.md
