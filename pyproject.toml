[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fancy-daily"
version = "0.1.0"
description = "Local-first daily note parser and summary helper."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vinay Gupta" }]
dependencies = []

[project.scripts]
fancy-daily = "fancy_daily.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
